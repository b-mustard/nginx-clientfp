# Example site for nginx-clientfp: put this file in /etc/nginx/sites-enabled/ and run
#   python3 /usr/share/doc/nginx-clientfp/examples/echo_server.py --port 8081
# then:
#   curl -k https://localhost:8443/            (HTTP/2 + TLS: JA4 and HTTP/2 signature)
#   curl -k --http3 https://localhost:8443/    (HTTP/3: JA4 starts with "q", no HTTP/2 signature)
#
# The packaged nginx.conf already adds X-Client-JA4 and X-Client-HTTP2-FP in http{}. A clientfp_request_header
# in a server{} block replaces the http{} list for that server, so this server lists every header it wants.

server {
	listen 8443 ssl;
	listen [::]:8443 ssl;
	listen 8443 quic reuseport;
	listen [::]:8443 quic reuseport;
	http2 on;

	server_name _;

	# self-signed certificate from the ssl-cert package
	include snippets/snakeoil.conf;

	add_header Alt-Svc 'h3=":8443"; ma=86400' always;

	clientfp_request_header X-Client-JA4 $clientfp_ja4;
	clientfp_request_header X-Client-JA4-R $clientfp_ja4_r;
	clientfp_request_header X-Client-JA4-O $clientfp_ja4_o;
	clientfp_request_header X-Client-JA4-RO $clientfp_ja4_ro;
	clientfp_request_header X-Client-HTTP2-FP $clientfp_http2;
	clientfp_request_header X-Client-HTTP2-FP-Hash $clientfp_http2_hash;
	clientfp_request_header X-Client-HTTP2-FP-Overflow $clientfp_http2_overflow;

	location / {
		proxy_pass http://127.0.0.1:8081;
		proxy_set_header Host $host;
	}

	# the same values straight from nginx, without an upstream
	location = /fp {
		default_type application/json;
		return 200 '{"ja4":"$clientfp_ja4","ja4_r":"$clientfp_ja4_r","ja4_o":"$clientfp_ja4_o","ja4_ro":"$clientfp_ja4_ro","http2":"$clientfp_http2","http2_hash":"$clientfp_http2_hash","http2_overflow":"$clientfp_http2_overflow"}\n';
	}
}
