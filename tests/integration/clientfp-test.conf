# Test site for tests/integration. Installed as /etc/nginx/sites-enabled/clientfp-test.conf next to the packaged
# nginx.conf (which already injects X-Client-JA4 and X-Client-HTTP2-FP).

server {
	listen 8443 ssl;
	listen 8443 quic reuseport;
	listen 8080;
	http2 on;

	server_name localhost;

	ssl_certificate /etc/nginx/test/cert.pem;
	ssl_certificate_key /etc/nginx/test/key.pem;
	# accept the unusual hellos of the hostile tests (TLS 1.0-1.2, RSA key exchange, no sigalgs)
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
	ssl_ciphers ALL:@SECLEVEL=0;
	ssl_session_cache shared:SSL:1m;

	location = /fp {
		default_type application/json;
		return 200 '{"ja4":"$clientfp_ja4","ja4_r":"$clientfp_ja4_r","ja4_o":"$clientfp_ja4_o","ja4_ro":"$clientfp_ja4_ro","akamai_fingerprint":"$clientfp_http2","akamai_fingerprint_hash":"$clientfp_http2_hash","overflow":"$clientfp_http2_overflow","protocol":"$server_protocol"}\n';
	}

	location = /ja4 {
		default_type text/plain;
		return 200 '$clientfp_ja4';
	}

	location = /h2 {
		default_type text/plain;
		return 200 '$clientfp_http2';
	}

	location /echo {
		proxy_pass http://127.0.0.1:8081;
	}
}

# A second server with its own header list (replaces the http{} list) and a forbidden-spoof check.
server {
	listen 8444 ssl;
	http2 on;
	server_name localhost;

	ssl_certificate /etc/nginx/test/cert.pem;
	ssl_certificate_key /etc/nginx/test/key.pem;

	clientfp_request_header X-FP-Ja4-O $clientfp_ja4_o;
	clientfp_request_header X-FP-H2-Hash $clientfp_http2_hash;

	location / {
		proxy_pass http://127.0.0.1:8081;
	}
}
